name: Validate automation-only SDK
on:
  push:
    branches: [refactor/automation-only-sdk]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.15'
      - run: python -m pip install -e '.[dev]' && pytest -q && python -m compileall -q src
